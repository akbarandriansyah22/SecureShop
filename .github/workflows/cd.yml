name: Publish image to GHCR

# Image dipublish setelah CI "Go CI + DevSecOps Pipeline" sukses di main.
# workflow_dispatch hanya jalan jika input confirm=publish DAN CI pada SHA yang sama sudah sukses.
# Perubahan k8s/terraform ikut memicu CI, tetapi publish tetap butuh CI hijau pada SHA itu.
on:
  workflow_run:
    workflows: ["Go CI + DevSecOps Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Ketik publish agar SHA ini boleh di-push ke GHCR"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  actions: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: akbarandriansyah22/devops-homelab/ecommerce-api

concurrency:
  group: ghcr-publish
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'publish') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Require successful CI for this SHA
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          count="$(gh api "/repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${sha}&status=success&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion=="success" and .head_sha=="'"${sha}"'")] | length')"
          if [ "${count}" -lt 1 ]; then
            echo "CI belum sukses untuk ${sha}. Dispatch dibatalkan."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=main-
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./ecommerce-api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
