name: Go CI + DevSecOps Pipeline

on:
  push:
    branches: ["main"]
    paths:
      - "ecommerce-api/**"
      - "k8s/**"
      - "infra/terraform/**"
      - ".gitleaksignore"
      - ".trivyignore"
      - ".github/workflows/ci.yml"
      - ".github/workflows/cd.yml"
  pull_request:
    paths:
      - "ecommerce-api/**"
      - "k8s/**"
      - "infra/terraform/**"
      - ".gitleaksignore"
      - ".trivyignore"
      - ".github/workflows/ci.yml"
      - ".github/workflows/cd.yml"

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Secret scanning (Gitleaks)
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 \
            detect --source . --no-git --verbose --redact

  go-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecommerce-api
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.2"
          cache: true
          cache-dependency-path: ecommerce-api/go.sum

      - name: Download dependencies
        run: |
          go mod download
          go mod verify

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.7.2
          working-directory: ecommerce-api
          args: --timeout=5m

      - name: Run GoSec (SAST)
        run: |
          set -euo pipefail
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.11
          gosec -severity high -fmt text ./...
          gosec -severity high -fmt sarif -out gosec.sarif ./...

      - name: Upload GoSec SARIF
        if: hashFiles('ecommerce-api/gosec.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ecommerce-api/gosec.sarif
          category: gosec

      - name: Run tests
        run: |
          go test -v -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Build application
        run: go build -v -o bin/ecommerce-api ./server/cmd

  api-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image
        working-directory: ecommerce-api
        run: docker build -t ecommerce-api:ci .

      - name: Trivy image scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.35.0, Trivy 0.69.3
        with:
          scan-type: image
          image-ref: ecommerce-api:ci
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Upload Trivy Image SARIF
        if: hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Trivy image gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.35.0, Trivy 0.69.3
        with:
          scan-type: image
          image-ref: ecommerce-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.35.0, Trivy 0.69.3
        with:
          scan-type: fs
          scan-ref: ecommerce-api
          format: cyclonedx
          output: sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.json

  fs-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy filesystem scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.35.0, Trivy 0.69.3
        with:
          scan-type: fs
          scan-ref: ecommerce-api
          format: sarif
          output: trivy-fs.sarif
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Upload Trivy FS SARIF
        if: hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Trivy filesystem gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.35.0, Trivy 0.69.3
        with:
          scan-type: fs
          scan-ref: ecommerce-api
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy config (Terraform)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.35.0, Trivy 0.69.3
        with:
          scan-type: config
          scan-ref: infra/terraform
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Trivy config (Kubernetes)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.35.0, Trivy 0.69.3
        with:
          scan-type: config
          scan-ref: k8s
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore

  web-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecommerce-api/apps/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ecommerce-api/apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high)
        run: npm audit --audit-level=high

      - name: Trivy filesystem (web)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.35.0, Trivy 0.69.3
        with:
          scan-type: fs
          scan-ref: ecommerce-api/apps/web
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build if script exists
        run: |
          if node -e "const s=require('./package.json').scripts||{}; process.exit(s.build?0:1)"; then
            npm run build
          fi
